# Blueprint do Render (plano GRATUITO) - versao multiusuario.
services:
  - type: web
    name: agenda-telegram-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: REMINDER_LEAD_MINUTES
        value: "30"
      - key: APP_BASE_URL
        value: https://agenda-telegram-bot.onrender.com
      - key: GITHUB_DATA_REPO
        value: thiagofreitxs/agenda-data
      # Secretos: preencher no painel do Render.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
