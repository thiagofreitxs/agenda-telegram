# Deploy no Render como "Background Worker" (não precisa de porta HTTP).
# 1) Suba este projeto em um repositório no GitHub.
# 2) No Render: New > Background Worker, aponte para o repositório.
# 3) Preencha as variáveis de ambiente (TELEGRAM_BOT_TOKEN, ALLOWED_TELEGRAM_IDS,
#    GOOGLE_TOKEN_JSON, TIMEZONE etc.) no painel.
services:
  - type: worker
    name: agenda-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    autoDeploy: true
    envVars:
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: GOOGLE_CALENDAR_ID
        value: primary
      # As variáveis sensíveis devem ser adicionadas manualmente no painel:
      # TELEGRAM_BOT_TOKEN, ALLOWED_TELEGRAM_IDS, GOOGLE_TOKEN_JSON
