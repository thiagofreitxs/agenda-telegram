# Blueprint do Render (plano GRATUITO).
# Ao criar um "Blueprint" no Render apontando para este repositório, ele lê este
# arquivo e configura o serviço automaticamente.
#
# Observação: o plano free "dorme" após ~15 min sem acesso. Use um monitor
# gratuito (UptimeRobot) apontando para a URL do serviço para mantê-lo acordado.

services:
  - type: web
    name: agenda-telegram-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: GOOGLE_CALENDAR_ID
        value: thiagofbg52@gmail.com
      - key: REMINDER_LEAD_MINUTES
        value: "30"
      # Valores secretos: o Render vai pedir para preencher ao criar o Blueprint.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_IDS
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
